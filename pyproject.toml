[project]
name = "debate-agent"
version = "0.3.0"
description = "Danwa user-app repo (Svelte frontend) — the FastAPI backend lives in the danwa-core sibling repo"
requires-python = ">=3.11"
# Runtime deps for local tooling only: the legacy backend that consumed
# litellm/fastapi/chromadb/etc. was removed (review §3.1, 2026-08-31).
# Backend runtime deps live in danwa-core/pyproject.toml.
dependencies = [
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "packaging>=23.0",
]

# PEP 735 dependency-groups replace the legacy [tool.uv] dev-dependencies
# table.  ``uv pip install --group dev`` reads this list; ``[test]`` in
# project.optional-dependencies is still used by the existing
# ``uv pip install -e ".[test]"`` line in CI.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "httpx>=0.27.0",
    "pdoc>=16.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/frontend", "tests/scripts"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
exclude = ["archive/", "frontend/", "tests/test_*.py"]

[tool.ruff.lint.per-file-ignores]
# Backend-specific ignores live in danwa-core/pyproject.toml —
# this repo no longer ships a backend (review §3.1, 2026-08-31).

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
