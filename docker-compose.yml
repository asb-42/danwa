# docker-compose.yml — Frontend deployment
#
# The backend (API server + Celery workers) is built and deployed from
# the danwa-core repo (its docker-compose.yml ships Dockerfile.backend).
# This repo is the Svelte frontend + Nginx reverse proxy. The backend
# container name expected by nginx.conf is "backend" — point
# DANWA_BACKEND_HOST at the danwa-core backend service (same docker
# network) or an external host.
#
# Local development (Redis only):
#   docker compose up redis -d
#
# Production:
#   cp deploy/.env.example deploy/.env  # Edit with real values
#   docker compose --env-file deploy/.env up -d

version: "3.9"

services:
  # --- Frontend + Nginx reverse proxy ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DANWA_BACKEND_HOST=${DANWA_BACKEND_HOST:-backend}
    volumes:
      # Mount TLS certificates (production)
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/letsencrypt/live/danwa.example.com:ro
    restart: unless-stopped

  # --- Redis (backend dependency; run here for local dev convenience) ---
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
