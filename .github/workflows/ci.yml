name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Frontend & Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup Python
        run: uv python install 3.11 && uv venv .venv
      - name: Sync dependencies
        # Install the project (with the [test] extra) and the
        # PEP 735 ``dev`` dependency-group (pytest-httpx, pdoc, etc.).
        # PEP 735 is the supported replacement for the deprecated
        # [tool.uv] dev-dependencies table.
        run: uv pip install -e ".[test]" --group dev
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        # Backend tests live in danwa-core (this repo is the frontend
        # app; the duplicated legacy backend was removed — review §3.1).
        run: uv run pytest tests/ -v
