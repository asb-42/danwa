# .github/workflows/deploy.yml — Build and deploy on push to main
#
# Requires the following GitHub secrets:
#   DEPLOY_HOST      — SSH hostname or IP
#   DEPLOY_USER      — SSH username
#   DEPLOY_KEY       — SSH private key
#   JWT_SECRET_KEY   — JWT signing key for production

name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup Python
        run: uv python install 3.12 && uv venv .venv
      - name: Sync dependencies
        run: uv pip install -e ".[test]"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        # Backend tests live in danwa-core (frontend-only repo — review §3.1).
        run: uv run pytest tests/ -v --tb=short

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        # Backend image builds from danwa-core (Dockerfile.backend there).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: danwa-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

